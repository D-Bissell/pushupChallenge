name: Deploy Hosting

# Free-plan deploy: builds the site and deploys ONLY Firebase Hosting.
# It deliberately does NOT deploy Functions (those require the Blaze plan).
#
# Auth: add a repo secret FIREBASE_SERVICE_ACCOUNT containing the JSON private
# key from Firebase console → Project settings → Service accounts →
# "Generate new private key". See docs/Deployment.md.
#
# Triggers on a manual run (Actions tab → Run workflow) and on pushes to the
# listed branches.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/pushup-challenge-dashboard-L4BqE

concurrency:
  group: deploy-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Firebase Hosting
    runs-on: ubuntu-latest
    env:
      # Optional public Firebase web config. If these secrets are absent the
      # site builds in "demo mode" with bundled sample data — which is exactly
      # what we want until a data collector exists.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_DEFAULT_TEAM_ID: ${{ vars.VITE_DEFAULT_TEAM_ID || 'a23' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pushup-fdef2
          channelId: live
