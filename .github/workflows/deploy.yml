name: Deploy Hosting

# Free-plan deploy: builds the site, deploys Firebase Hosting, and deploys the
# Firestore security rules + indexes. None of this needs the Blaze plan
# (Cloud Functions are never deployed here).
#
# Prerequisite: the Firestore database must already exist (create it once in the
# console: Build → Firestore Database → Create database). The rules deploy step
# fails if there is no database yet.
#
# Auth: repo secret FIREBASE_SERVICE_ACCOUNT (Firebase service-account JSON).

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy site + Firestore rules
    runs-on: ubuntu-latest
    env:
      # Optional public Firebase web config. If these secrets are absent the
      # site builds in "demo mode" with bundled sample data. Add them to flip
      # the live site over to real Firestore data.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_DEFAULT_TEAM_ID: ${{ vars.VITE_DEFAULT_TEAM_ID || 'a23' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pushup-fdef2
          channelId: live

      # NOTE: Firestore rules/indexes are NOT deployed here. The default
      # service-account key lacks the Firebase Rules Admin permission, and on the
      # free/browser setup the rules are published once via the Firestore console
      # (Firestore Database → Rules). The canonical rules live in firestore.rules.
      # To re-enable CI rule deploys, grant the SA roles/firebaserules.admin and
      # add a `deploy --only firestore` step here.
