name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy to Firebase
    runs-on: ubuntu-latest
    env:
      # Public Firebase web config (injected into the Vite build).
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_DEFAULT_TEAM_ID: ${{ vars.VITE_DEFAULT_TEAM_ID || 'a23' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --- Build frontend ---
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build

      # --- Build functions ---
      - name: Install & build functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      # --- Deploy everything (Hosting, Firestore rules/indexes, Functions) ---
      # FIREBASE_SERVICE_ACCOUNT must be the JSON key of a service account with
      # the "Firebase Admin" + "Cloud Functions Admin" + "Service Account User"
      # roles. See docs/Deployment.md.
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v14.10.1
        with:
          args: deploy --only hosting,firestore,functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
