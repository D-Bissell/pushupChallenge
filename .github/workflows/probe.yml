name: Probe API

# One-off API discovery helper. Runs the probe script (functions/src/probe.ts)
# from GitHub's network, which can reach the source site. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Team/fundraiser slug to probe'
        required: false
        default: 'a23'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install & build
        working-directory: functions
        run: |
          npm ci
          npm run build
      - name: Run probe
        working-directory: functions
        run: node lib/probe.js
        env:
          PROBE_SLUG: ${{ github.event.inputs.slug }}
