name: Preview Deploy

# Deploys a branch to a temporary Firebase Hosting *preview* channel — a separate
# URL that does NOT touch the live site — so changes can be reviewed with real
# data without merging to main. Preview channels expire automatically.
#
# On a pull request it creates a per-PR channel and comments the URL on the PR.
# It can also be dispatched manually (deploys to a fixed "manual-preview" channel).
#
# Auth/config reuse the same repo secrets as deploy.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & deploy preview channel
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_DEFAULT_TEAM_ID: ${{ vars.VITE_DEFAULT_TEAM_ID || 'a23' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to a Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pushup-fdef2
          # PR runs auto-create a per-PR channel; manual runs use a fixed one.
          channelId: ${{ github.event_name == 'workflow_dispatch' && 'manual-preview' || '' }}
          expires: 30d
